<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الهلباوى LexBridge — غرفة البث</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#101014;
    color:#fff;
}
header{
    padding:16px;
    background:#17171d;
    border-bottom:1px solid #292932;
}
h1{margin:0;font-size:20px}
#status{
    margin-top:6px;
    color:#aaa;
    font-size:13px;
}
.room{
    padding:12px;
}
.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:12px;
}
.card{
    position:relative;
    background:#18181f;
    border-radius:14px;
    overflow:hidden;
    min-height:220px;
}
video{
    width:100%;
    height:280px;
    object-fit:cover;
    background:#050505;
    display:block;
}
.label{
    position:absolute;
    right:10px;
    bottom:10px;
    background:#000b;
    padding:6px 10px;
    border-radius:8px;
}
.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}
button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#292933;
    color:#fff;
    font-size:15px;
}
button:active{opacity:.7}
button.danger{background:#7d2525}
button.active{background:#28633b}
.log{
    margin-top:14px;
    background:#17171d;
    padding:12px;
    border-radius:10px;
    min-height:70px;
    color:#bbb;
    font-size:13px;
    white-space:pre-wrap;
}

.room-panel{
    margin-top:14px;
    padding:14px;
    background:#17171d;
    border:1px solid #292932;
    border-radius:14px;
}
.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}
.seats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}
.seat{
    min-height:72px;
    padding:8px;
    border-radius:10px;
    background:#202028;
    border:1px solid #30303a;
    text-align:center;
    font-size:12px;
}
.seat.occupied{
    border-color:#28633b;
    background:#183322;
}
.seat.requested{
    border-color:#806522;
    background:#302812;
}
.seat-number{
    font-size:16px;
    font-weight:bold;
}
.seat-user{
    margin-top:5px;
    color:#aaa;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.seat-media{
    margin-top:4px;
    font-size:11px;
}
.seat-empty{
    grid-column:1/-1;
    padding:14px;
    text-align:center;
    color:#999;
}
.seat-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}
.seat-actions select{
    flex:1;
    min-width:140px;
    padding:11px;
    border:1px solid #444;
    border-radius:9px;
    background:#101014;
    color:#fff;
}
.seat-actions button{
    padding:11px 13px;
}
.room-ads{
    padding:13px;
    border-radius:10px;
    background:#211b10;
    color:#d9b96e;
    text-align:center;
}



.room-ad-item {
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.room-ad-item:last-child {
    margin-bottom: 0;
}

.room-chat {
    margin-top: 16px;
}

.room-chat-messages {
    height: 260px;
    overflow-y: auto;
    padding: 10px;
    border-radius: 14px;
    background: rgba(0,0,0,.18);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.chat-message {
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.chat-user {
    font-weight: 700;
    margin-left: 6px;
}

.chat-time {
    opacity: .55;
    font-size: 11px;
}

.room-chat-form {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.room-chat-form input {
    flex: 1;
    min-width: 0;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 10px;
    background: rgba(0,0,0,.2);
    color: inherit;
}

.room-chat-form button {
    border: 0;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
}

</style>

<body>

<header>
    <h1>⚖️ الهلباوى LexBridge — غرفة البث</h1>
    <div id="status">جاري الاتصال...</div>
</header>

<main class="room">

<div class="video-grid">

    <div class="card">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="label">أنا</div>
    </div>

    <div class="card">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="label">الطرف الآخر</div>
    </div>

</div>

<div class="controls">
    <button id="startMedia">🎙️📷 تشغيل الصوت والكاميرا</button>
    <button id="toggleMic">🎙️ الميكروفون</button>
    <button id="toggleCamera">📷 الكاميرا</button>
    <button id="callPeer">📞 بدء الاتصال</button>
    <button id="leaveRoom" class="danger">🚪 مغادرة</button>
</div>

<div id="log" class="log"></div>

<section class="room-panel">
    <div class="panel-title">
        <strong>🪑 مقاعد الغرفة</strong>
        <span id="viewerCount">👥 0</span>
    </div>


<section id="roomChat" class="room-panel room-chat">
    <div class="panel-title">
        <strong>💬 محادثة الغرفة</strong>
    </div>

    <div id="roomChatMessages" class="room-chat-messages">
        <div class="chat-message">جاري تحميل المحادثة...</div>
    </div>

    <form id="roomChatForm" class="room-chat-form">
        <input
            id="roomChatInput"
            type="text"
            maxlength="1000"
            autocomplete="off"
            placeholder="اكتب رسالتك..."
        >
        <button type="submit">إرسال</button>
    </form>
</section>

<div id="roomSeats" class="seats-grid">
        <div class="seat-empty">جاري تحميل المقاعد...</div>
    </div>

    <div class="seat-actions">
        <select id="seatNumber">
            <option value="">اختر مقعدًا</option>
        </select>
        <button id="requestSeat">🪑 طلب الجلوس</button>
        <button id="leaveSeat">🚪 مغادرة المقعد</button>
    </div>
</section>

<section class="room-panel">
    <div class="panel-title">
        <strong>📢 إعلانات الغرفة</strong>
    </div>
    <div id="roomAds" class="room-ads">
        مرحبًا بكم في غرفة الهلباوى LexBridge
    </div>
</section>

</main>

<script src="/socket.io/socket.io.js"></script>
<script>
function renderSeats(seats){
    const container = document.getElementById('roomSeats');
    const select = document.getElementById('seatNumber');

    if(!Array.isArray(seats)){
        return;
    }

    const occupied = seats.filter(
        seat => seat.status === 'OCCUPIED'
    ).length;

    document.getElementById('viewerCount').textContent =
        '👥 ' + occupied;

    container.innerHTML = seats.map(seat => {
        const status = seat.status || 'EMPTY';
        const user = seat.user_id || '';

        let text = 'فارغ';

        if(status === 'OCCUPIED'){
            text = 'مشغول';
        }else if(status === 'REQUESTED'){
            text = 'في انتظار القبول';
        }

        const media =
            status === 'OCCUPIED'
                ? `${seat.mic_enabled ? '🎙️' : '🔇'} ${seat.camera_enabled ? '📷' : '🚫'}`
                : '';

        return `
            <div class="seat ${status.toLowerCase()}">
                <div class="seat-number">مقعد ${seat.seat_number}</div>
                <div class="seat-user">${user ? escapeHtml(user) : text}</div>
                <div class="seat-media">${media}</div>
            </div>
        `;
    }).join('');

    select.innerHTML =
        '<option value="">اختر مقعدًا</option>' +
        seats
            .filter(seat => seat.status === 'EMPTY')
            .map(seat =>
                `<option value="${seat.seat_number}">مقعد ${seat.seat_number}</option>`
            )
            .join('');
}

function escapeHtml(value){
    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function requestSeat(){
    const seatNumber =
        document.getElementById('seatNumber').value;

    if(!seatNumber){
        setStatus('اختر مقعدًا أولًا');
        return;
    }

    socket.emit(
        'seat:request',
        {
            roomId,
            seatNumber:Number(seatNumber)
        },
        response => {
            if(!response?.ok){
                setStatus(
                    'تعذر طلب المقعد: ' +
                    (response?.error || '')
                );
                return;
            }

            setStatus('تم إرسال طلب الجلوس');
        }
    );
}

function leaveSeat(){
    socket.emit(
        'seat:leave',
        {roomId},
        response => {
            if(!response?.ok){
                setStatus(
                    'تعذر مغادرة المقعد: ' +
                    (response?.error || '')
                );
                return;
            }

            setStatus('تمت مغادرة المقعد');
        }
    );
}

document.addEventListener('DOMContentLoaded', () => {
    loadRoomAds();

    const roomChatForm = document.getElementById('roomChatForm');

    if (roomChatForm) {
        roomChatForm.addEventListener('submit', event => {
            event.preventDefault();
            sendRoomMessage();
        });
    }


    const requestButton = document.getElementById('requestSeat');
    const leaveButton = document.getElementById('leaveSeat');

    if(requestButton){
        requestButton.onclick = requestSeat;
    }

    if(leaveButton){
        leaveButton.onclick = leaveSeat;
    }
});

</script>

<script>
const params = new URLSearchParams(location.search);

const roomId = params.get('room');
const token = params.get('token');
let targetSocketId = params.get('peer');

const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

let socket = null;
let localStream = null;
let peerConnection = null;

const rtcConfig = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' }
    ]
};

function log(message){
    logEl.textContent += message + '\n';
}

function setStatus(message){
    statusEl.textContent = message;
    log(message);
}

function requireConfig(){
    if(!roomId){
        throw new Error('معرف الغرفة غير موجود');
    }

    if(!token){
        throw new Error('رمز الجلسة غير موجود');
    }
}

async function startMedia(){
    if(localStream){
        return localStream;
    }

    localStream = await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:true
    });

    localVideo.srcObject = localStream;

    document
        .getElementById('startMedia')
        .classList.add('active');

    setStatus('تم تشغيل الميكروفون والكاميرا');

    return localStream;
}

function createPeerConnection(peerId){
    if(peerConnection){
        peerConnection.close();
    }

    peerConnection = new RTCPeerConnection(rtcConfig);

    for(const track of localStream.getTracks()){
        peerConnection.addTrack(track, localStream);
    }

    peerConnection.ontrack = async event => {
        if(event.streams && event.streams[0]){
            remoteVideo.srcObject = event.streams[0];
            remoteVideo.muted = false;
            remoteVideo.volume = 1;

            try {
                await remoteVideo.play();
                setStatus('تم استقبال الصوت والصورة من الطرف الآخر');
            } catch(error) {
                setStatus('تم استقبال الوسائط — اضغط تشغيل الصوت');
            }
        }
    };

    peerConnection.onicecandidate = event => {
        if(!event.candidate){
            return;
        }

        socket.emit(
            'webrtc:ice-candidate',
            {
                roomId,
                targetSocketId:peerId,
                payload:event.candidate
            }
        );
    };

    peerConnection.oniceconnectionstatechange = () => {
        setStatus(
            'حالة ICE: ' +
            peerConnection.iceConnectionState
        );
        console.log(
            'ICE_CONNECTION_STATE:',
            peerConnection.iceConnectionState
        );
    };

    peerConnection.onicegatheringstatechange = () => {
        console.log(
            'ICE_GATHERING_STATE:',
            peerConnection.iceGatheringState
        );
    };

    peerConnection.onconnectionstatechange = () => {
        setStatus(
            'حالة WebRTC: ' +
            peerConnection.connectionState
        );
        console.log(
            'WEBRTC_CONNECTION_STATE:',
            peerConnection.connectionState
        );
    };

    return peerConnection;
}

async function startCall(){
    if(!socket){
        throw new Error('Socket غير متصل');
    }

    if(!targetSocketId){
        const response = await new Promise(resolve => {
            socket.emit(
                'webrtc:peers',
                {roomId},
                resolve
            );
        });

        if(!response?.ok){
            throw new Error(
                response?.error || 'تعذر اكتشاف الطرف الآخر'
            );
        }

        const peers = response.data?.peers || [];

        if(peers.length === 0){
            throw new Error(
                'لا يوجد طرف آخر متصل بالغرفة'
            );
        }

        targetSocketId = peers[0].socketId;

        log(
            'تم اكتشاف الطرف الآخر تلقائيًا: ' +
            targetSocketId
        );
    }

    await startMedia();

    const pc = createPeerConnection(targetSocketId);

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    const response = await new Promise(resolve => {
        socket.emit(
            'webrtc:offer',
            {
                roomId,
                targetSocketId,
                payload:offer
            },
            resolve
        );
    });

    if(!response?.ok){
        throw new Error(
            response?.error || 'فشل إرسال العرض'
        );
    }

    setStatus('تم إرسال Offer');
}

async function handleOffer(data){
    await startMedia();

    const peerId = data.fromSocketId;

    const pc = createPeerConnection(peerId);

    await pc.setRemoteDescription(
        new RTCSessionDescription(data.payload)
    );

    const answer = await pc.createAnswer();

    await pc.setLocalDescription(answer);

    socket.emit(
        'webrtc:answer',
        {
            roomId,
            targetSocketId:peerId,
            payload:answer
        }
    );

    setStatus('تم استقبال Offer وإرسال Answer');
}

async function handleAnswer(data){
    if(!peerConnection){
        return;
    }

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(data.payload)
    );

    setStatus('تم استقبال Answer');
}

async function handleIce(data){
    if(!peerConnection || !data.payload){
        return;
    }

    try{
        await peerConnection.addIceCandidate(
            new RTCIceCandidate(data.payload)
        );
    }catch(error){
        log('ICE ERROR: ' + error.message);
    }
}

async function connect(){
    requireConfig();

    socket = io({
        auth:{token},
        transports:['websocket']
    });

    socket.on('connect', async () => {
        setStatus('Socket متصل');

        try {
            const meResponse = await fetch(
                '/api/auth/me',
                {
                    headers:{
                        Authorization:`Bearer ${token}`
                    }
                }
            );

            const meData = await meResponse.json();

            if(!meResponse.ok || !meData?.ok){
                throw new Error(
                    meData?.error ||
                    meData?.message ||
                    'تعذر معرفة المستخدم الحالي'
                );
            }

            const currentUserId =
                meData.user?.id ||
                meData.user?.user_id ||
                meData.data?.user?.id ||
                meData.data?.user?.user_id ||
                meData.data?.id ||
                meData.data?.user_id ||
                meData.id ||
                meData.user_id;

            if(!currentUserId){
                console.error('AUTH_ME_RESPONSE', meData);
                throw new Error('تعذر تحديد معرف المستخدم');
            }

            const roomResponse = await fetch(
                `/api/rooms/${encodeURIComponent(roomId)}`,
                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const roomData = await roomResponse.json();

            if(!roomResponse.ok || !roomData?.ok || !roomData?.room){
                throw new Error(
                    roomData?.error ||
                    roomData?.message ||
                    'تعذر تحميل بيانات الغرفة'
                );
            }

            const room = roomData.room;

            const isOwner =
                room.owner_user_id === currentUserId;

            if(isOwner && room.status !== 'LIVE'){
                setStatus('جاري تشغيل الغرفة...');

                const startResponse = await fetch(
                    '/api/room-engine/start',
                    {
                        method:'POST',
                        headers:{
                            Authorization:`Bearer ${token}`
                        }
                    }
                );

                const startData = await startResponse.json();

                if(!startResponse.ok || !startData?.ok){
                    throw new Error(
                        startData?.error ||
                        startData?.message ||
                        'تعذر تشغيل الغرفة'
                    );
                }

                setStatus('تم تشغيل الغرفة');
            }

            socket.emit(
                'room:join',
                {roomId},
                response => {
                    if(!response?.ok){
                        setStatus(
                            'فشل دخول الغرفة: ' +
                            (response?.error || '')
                        );
                        return;
                    }

                    setStatus('تم دخول الغرفة بنجاح');
                }
            );

        }catch(error){
            setStatus(
                'تعذر تجهيز الغرفة: ' +
                error.message
            );
        }
    });

    socket.on('seat:invitation', data => {
        const accepted = confirm('تم إرسال دعوة للمايك والكاميرا. هل تريد قبولها؟');

        socket.emit(
            accepted ? 'seat:accept' : 'seat:reject',
            {
                roomId: data.roomId,
                seatNumber: data.seat.seat_number
            },
            response => {
                if (!response?.ok) {
                    setStatus('تعذر معالجة الدعوة: ' + (response?.error || ''));
                    return;
                }

                setStatus(
                    accepted
                        ? 'تم قبول دعوة المايك والكاميرا'
                        : 'تم رفض الدعوة'
                );
            }
        );
    });

    socket.on('seat:accepted', async data => {
        try {
            const seatNumber = data?.seat?.seat_number;

            await startMedia();

            socket.emit(
                'seat:media',
                {
                    roomId: data.roomId,
                    seatNumber,
                    micEnabled: true,
                    cameraEnabled: true
                },
                response => {
                    if (!response?.ok) {
                        setStatus('تعذر تحديث حالة المايك والكاميرا');
                    }
                }
            );

            targetSocketId = data.fromSocketId || targetSocketId;

            await startCall();

            setStatus('تم الاتصال عبر WebRTC');
        } catch (error) {
            setStatus('تعذر تشغيل المايك/الكاميرا: ' + error.message);
        }
    });

    socket.on('connect_error', error => {
        setStatus(
            'فشل الاتصال: ' +
            error.message
        );
    });



async function loadRoomAds() {
    const container = document.getElementById('roomAds');

    if (!container || !roomId) {
        return;
    }

    try {
        const response = await fetch(
            `/api/rooms/${encodeURIComponent(roomId)}/ads`
        );

        const result = await response.json();

        if (!response.ok || !result?.ok) {
            throw new Error(
                result?.error || 'ROOM_ADS_LOAD_ERROR'
            );
        }

        const ads = result.data?.ads || [];

        if (!ads.length) {
            container.innerHTML =
                'لا توجد إعلانات حالياً.';
            return;
        }

        container.innerHTML = ads.map(ad => `
            <div class="room-ad-item">
                <strong>${escapeChatHtml(ad.title)}</strong>
                <div>${escapeChatHtml(ad.content)}</div>
            </div>
        `).join('');
    } catch (error) {
        container.innerHTML =
            'تعذر تحميل إعلانات الغرفة.';
    }
}

function escapeChatHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function renderRoomMessages(messages) {
    const container = document.getElementById('roomChatMessages');

    if (!container) {
        return;
    }

    if (!messages || messages.length === 0) {
        container.innerHTML =
            '<div class="chat-message">لا توجد رسائل بعد.</div>';
        return;
    }

    container.innerHTML = messages.map(item => {
        const name =
            item.display_name ||
            item.username ||
            'مستخدم';

        const time = item.created_at
            ? new Date(item.created_at).toLocaleTimeString('ar-EG', {
                hour: '2-digit',
                minute: '2-digit'
            })
            : '';

        return `
            <div class="chat-message">
                <span class="chat-user">${escapeChatHtml(name)}</span>
                <span class="chat-time">${escapeChatHtml(time)}</span>
                <div>${escapeChatHtml(item.message)}</div>
            </div>
        `;
    }).join('');

    container.scrollTop = container.scrollHeight;
}

function loadRoomMessages() {
    socket.emit(
        'room:chat:list',
        {
            roomId,
            limit: 50
        },
        response => {
            if (response?.ok) {
                renderRoomMessages(
                    response.data?.messages || []
                );
            }
        }
    );
}

function sendRoomMessage() {
    const input = document.getElementById('roomChatInput');

    if (!input) {
        return;
    }

    const message = input.value.trim();

    if (!message) {
        return;
    }

    socket.emit(
        'room:chat:send',
        {
            roomId,
            message
        },
        response => {
            if (response?.ok) {
                input.value = '';
                input.focus();
            } else if (response?.error) {
                alert(response.error);
            }
        }
    );
}

socket.on('room:chat:message', message => {
    if (!message || message.room_id !== roomId) {
        return;
    }

    const container = document.getElementById('roomChatMessages');

    if (!container) {
        return;
    }

    const empty = container.querySelector('.chat-message');

    if (
        empty &&
        empty.textContent.includes('لا توجد رسائل')
    ) {
        container.innerHTML = '';
    }

    const name =
        message.display_name ||
        message.username ||
        'مستخدم';

    const time = message.created_at
        ? new Date(message.created_at).toLocaleTimeString('ar-EG', {
            hour: '2-digit',
            minute: '2-digit'
        })
        : '';

    const item = document.createElement('div');
    item.className = 'chat-message';

    item.innerHTML = `
        <span class="chat-user">${escapeChatHtml(name)}</span>
        <span class="chat-time">${escapeChatHtml(time)}</span>
        <div>${escapeChatHtml(message.message)}</div>
    `;

    container.appendChild(item);
    container.scrollTop = container.scrollHeight;
});


socket.on('room:seats', data => {
    if(data?.roomId !== roomId){
        return;
    }

    renderSeats(data.seats || []);
});

socket.emit(
    'seat:list',
    {roomId},
    response => {
        if(response?.ok){
            renderSeats(response.data?.seats || []);
        }
    }
);

socket.on('webrtc:offer', handleOffer);
    socket.on('webrtc:answer', handleAnswer);
    socket.on('webrtc:ice-candidate', handleIce);

    socket.on('disconnect', () => {
        setStatus('تم قطع اتصال Socket');
    });
}

document
    .getElementById('startMedia')
    .onclick = async () => {
        try{
            await startMedia();
        }catch(error){
            setStatus(
                'تعذر تشغيل الكاميرا/الميكروفون: ' +
                error.message
            );
        }
    };

document
    .getElementById('callPeer')
    .onclick = async () => {
        try{
            await startCall();
        }catch(error){
            setStatus(
                'فشل بدء الاتصال: ' +
                error.message
            );
        }
    };

document
    .getElementById('toggleMic')
    .onclick = () => {
        if(!localStream){
            return;
        }

        const tracks = localStream.getAudioTracks();

        for(const track of tracks){
            track.enabled = !track.enabled;
        }

        setStatus(
            tracks[0]?.enabled
                ? 'الميكروفون يعمل'
                : 'الميكروفون مغلق'
        );
    };

document
    .getElementById('toggleCamera')
    .onclick = () => {
        if(!localStream){
            return;
        }

        const tracks = localStream.getVideoTracks();

        for(const track of tracks){
            track.enabled = !track.enabled;
        }

        setStatus(
            tracks[0]?.enabled
                ? 'الكاميرا تعمل'
                : 'الكاميرا مغلقة'
        );
    };

document
    .getElementById('leaveRoom')
    .onclick = () => {
        if(socket){
            socket.emit(
                'room:leave',
                {roomId}
            );

            socket.disconnect();
        }

        if(peerConnection){
            peerConnection.close();
        }

        if(localStream){
            for(const track of localStream.getTracks()){
                track.stop();
            }
        }

        setStatus('تمت مغادرة الغرفة');
    };

try{
    connect();
}catch(error){
    setStatus(error.message);
}
</script>


<script id="lexbridge-global-back-script">
(function () {
    'use strict';

    function isHomeScreen() {
        var path = String(window.location.pathname || '').toLowerCase();

        if (path.endsWith('/room.html')) {
            return false;
        }

        var overlays = [
            'activityCenter',
            'messagesCenter',
            'meCenter',
            'walletCenter',
            'featuresCenter',
            'roomsCenter'
        ];

        for (var i = 0; i < overlays.length; i++) {
            var el = document.getElementById(overlays[i]);
            if (el && !el.classList.contains('hidden')) {
                return false;
            }
        }

        return true;
    }

    function findOpenScreen() {
        var selectors = [
            '#activityCenter:not(.hidden)',
            '#messagesCenter:not(.hidden)',
            '#meCenter:not(.hidden)',
            '#walletCenter:not(.hidden)',
            '#featuresCenter:not(.hidden)',
            '#roomsCenter:not(.hidden)',
            '[data-lexbridge-screen]:not(.hidden)'
        ];

        for (var i = 0; i < selectors.length; i++) {
            try {
                var found = document.querySelector(selectors[i]);
                if (found) return found;
            } catch (_) {}
        }

        return null;
    }

    function closeKnownScreen() {
        var open = findOpenScreen();

        if (!open) {
            return false;
        }

        var id = open.id;

        var closers = {
            activityCenter: 'closeActivityCenter',
            messagesCenter: 'closeMessagesCenter',
            meCenter: 'closeMeCenter',
            walletCenter: 'closeWalletCenter',
            featuresCenter: 'closeFeaturesCenter',
            roomsCenter: 'closeRoomsCenter'
        };

        var fnName = closers[id];

        if (fnName && typeof window[fnName] === 'function') {
            try {
                window[fnName]();
                return true;
            } catch (_) {}
        }

        open.classList.add('hidden');
        return true;
    }

    function goBack() {
        if (closeKnownScreen()) {
            update();
            return;
        }

        var path = String(window.location.pathname || '').toLowerCase();

        if (path.endsWith('/room.html')) {
            window.location.href = '/';
            return;
        }

        if (window.history.length > 1) {
            window.history.back();
            return;
        }

        window.location.href = '/';
    }

    function update() {
        var button = document.getElementById('lexbridge-global-back');

        if (!button) return;

        button.style.display = isHomeScreen() ? 'none' : 'flex';
    }

    function install() {
        if (document.getElementById('lexbridge-global-back')) {
            update();
            return;
        }

        var button = document.createElement('button');

        button.id = 'lexbridge-global-back';
        button.type = 'button';
        button.setAttribute('aria-label', 'رجوع');
        button.innerHTML = '↩️ <span>رجوع</span>';
        button.addEventListener('click', goBack);

        document.body.appendChild(button);

        update();

        var observer = new MutationObserver(function () {
            update();
        });

        observer.observe(document.body, {
            subtree: true,
            attributes: true,
            attributeFilter: ['class']
        });

        window.addEventListener('popstate', update);
        window.addEventListener('hashchange', update);

        window.lexBridgeGlobalBack = goBack;
        window.lexBridgeUpdateBackButton = update;

        console.log('LEXBRIDGE_GLOBAL_BACK_READY');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', install);
    } else {
        install();
    }
})();
</script>


<script id="alhelbawy-room-realtime-script">
(function () {
    "use strict";

    function applyRoomRealtimeState(payload) {
        if (!payload) return;

        const state =
            payload.data ||
            payload.state ||
            payload.room ||
            payload;

        if (!state || typeof state !== "object") return;

        const viewerCount =
            state.viewerCount ??
            state.viewer_count ??
            state.presence?.viewerCount ??
            state.presence?.count;

        if (viewerCount !== undefined) {
            const candidates = [
                "viewerCount",
                "roomViewerCount",
                "viewer-count",
                "room-viewer-count"
            ];

            candidates.forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.textContent = String(viewerCount);
            });

            document
                .querySelectorAll(
                    "[data-room-viewers], [data-viewer-count]"
                )
                .forEach(function (el) {
                    el.textContent = String(viewerCount);
                });
        }

        if (state.status) {
            document
                .querySelectorAll(
                    "[data-room-status], #roomStatus"
                )
                .forEach(function (el) {
                    el.textContent = String(state.status);
                });
        }

        if (state.name || state.room_name) {
            const name = state.name || state.room_name;

            document
                .querySelectorAll(
                    "[data-room-name], #roomName"
                )
                .forEach(function (el) {
                    el.textContent = String(name);
                });
        }

        window.dispatchEvent(
            new CustomEvent("lexbridge:room-state", {
                detail: state
            })
        );
    }

    function attachRoomRealtime(socket) {
        if (!socket || socket.__lexbridgeRoomRealtime) return;

        socket.__lexbridgeRoomRealtime = true;

        socket.on("room:state", function (payload) {
            console.log("LEXBRIDGE_ROOM_STATE", payload);
            applyRoomRealtimeState(payload);
        });

        socket.on("room:updated", function (payload) {
            console.log("LEXBRIDGE_ROOM_UPDATED", payload);
            applyRoomRealtimeState(payload);
        });

        socket.on("room:presence", function (payload) {
            console.log("LEXBRIDGE_ROOM_PRESENCE", payload);
            applyRoomRealtimeState(payload);
        });

        window.__LEXBRIDGE_ROOM_REALTIME_READY = true;
    }

    function scanForSocket() {
        const candidates = [
            window.socket,
            window.roomSocket,
            window.ioSocket,
            window.currentSocket
        ];

        for (const socket of candidates) {
            if (
                socket &&
                typeof socket.on === "function"
            ) {
                attachRoomRealtime(socket);
                return true;
            }
        }

        return false;
    }

    window.attachLexBridgeRoomRealtime = attachRoomRealtime;
    window.applyLexBridgeRoomRealtime = applyRoomRealtimeState;

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            function () {
                scanForSocket();
                setTimeout(scanForSocket, 500);
                setTimeout(scanForSocket, 1500);
            }
        );
    } else {
        scanForSocket();
        setTimeout(scanForSocket, 500);
        setTimeout(scanForSocket, 1500);
    }

    console.log("ROOM_REALTIME_LISTENER_READY");
})();
</script>
